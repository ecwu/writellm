name: Release candidate

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Exact existing tag to rebuild
        required: true
        type: string
      mode:
        description: Promotion mode
        required: true
        type: choice
        default: dry-run
        options:
          - dry-run
          - production

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

env:
  PNPM_VERSION: 11.17.0
  NODE_VERSION: 24.15.0

jobs:
  source:
    name: Verify tagged source
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      revision: ${{ steps.revision.outputs.sha }}
    steps:
      - name: Checkout exact tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - name: Install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Verify tag, package version, lockfile, and clean checkout
        id: revision
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          revision="$(git rev-parse HEAD)"
          node scripts/verify-release-source.mjs "--tag=${RELEASE_TAG}" "--revision=${revision}"
          echo "sha=${revision}" >> "${GITHUB_OUTPUT}"

  package:
    name: Candidate ${{ matrix.target }}
    needs: source
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    environment: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows-x64
            runner: windows-2022
            signing: windows
            command: package:windows-x64
          - target: macos-arm64
            runner: macos-15
            signing: macos
            command: package:macos-arm64
          - target: macos-x64
            runner: macos-15-intel
            signing: macos
            command: package:macos-x64
          - target: linux-x64
            runner: ubuntu-24.04
            signing: none
            command: package:linux-x64
    steps:
      - name: Checkout exact tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false
      - name: Install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Frozen dependency install
        run: pnpm install --frozen-lockfile
      - name: Install Linux Secret Service
        if: ${{ matrix.target == 'linux-x64' }}
        run: |
          sudo apt-get update
          sudo apt-get install --yes dbus-x11 gnome-keyring libsecret-tools
      - name: Verify recovery fixtures
        run: pnpm check:fixtures
      - name: Verify static boundary
        run: pnpm check:fast
      - name: Canonical Electron tests and build
        run: pnpm check:electron
      - name: Complete silent Electron E2E
        if: ${{ matrix.target != 'linux-x64' }}
        run: pnpm test:e2e
      - name: Complete silent Electron E2E with Linux Secret Service
        if: ${{ matrix.target == 'linux-x64' }}
        shell: bash
        run: |
          bash scripts/run-with-linux-secret-service.sh \
            xvfb-run --auto-servernum pnpm test:e2e
      - name: Native-host package, inventory, and packaged smoke
        if: ${{ inputs.mode == 'dry-run' && matrix.target != 'linux-x64' }}
        run: pnpm run ${{ matrix.command }}
      - name: Linux native-host package, inventory, and packaged smoke
        if: ${{ inputs.mode == 'dry-run' && matrix.target == 'linux-x64' }}
        shell: bash
        run: |
          bash scripts/run-with-linux-secret-service.sh \
            xvfb-run --auto-servernum pnpm run package:linux-x64
      - name: Signed production package, inventory, and packaged smoke
        if: ${{ inputs.mode == 'production' && matrix.target != 'linux-x64' }}
        env:
          WRITELLM_RELEASE_TAG: ${{ inputs.tag }}
          CSC_LINK: ${{ matrix.signing == 'windows' && secrets.WINDOWS_CSC_LINK || matrix.signing == 'macos' && secrets.MACOS_CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ matrix.signing == 'windows' && secrets.WINDOWS_CSC_KEY_PASSWORD || matrix.signing == 'macos' && secrets.MACOS_CSC_KEY_PASSWORD || '' }}
          APPLE_ID: ${{ matrix.signing == 'macos' && secrets.MACOS_APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ matrix.signing == 'macos' && secrets.MACOS_APP_SPECIFIC_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ matrix.signing == 'macos' && secrets.MACOS_TEAM_ID || '' }}
        run: pnpm check:release
      - name: Linux production package, inventory, and packaged smoke
        if: ${{ inputs.mode == 'production' && matrix.target == 'linux-x64' }}
        shell: bash
        env:
          WRITELLM_RELEASE_TAG: ${{ inputs.tag }}
        run: |
          bash scripts/run-with-linux-secret-service.sh \
            xvfb-run --auto-servernum pnpm check:release
      - name: Upload candidate row
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: writellm-${{ matrix.target }}-${{ needs.source.outputs.revision }}
          path: |
            dist/${{ matrix.target }}/*.dmg
            dist/${{ matrix.target }}/*.zip
            dist/${{ matrix.target }}/*.exe
            dist/${{ matrix.target }}/*.AppImage
            dist/${{ matrix.target }}/*.deb
            dist/${{ matrix.target }}/package-evidence.json
          if-no-files-found: error
          retention-days: 30

  promote:
    name: Protected promotion
    needs:
      - source
      - package
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: release
    permissions:
      contents: write
    steps:
      - name: Checkout exact tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - name: Download complete candidate matrix
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: writellm-*-${{ needs.source.outputs.revision }}
          path: release-input
      - name: Verify complete promotion evidence
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_MODE: ${{ inputs.mode }}
          RELEASE_REVISION: ${{ needs.source.outputs.revision }}
        run: >-
          node scripts/verify-release-evidence.mjs
          --root=release-input
          --output=release-output
          "--tag=${RELEASE_TAG}"
          "--mode=${RELEASE_MODE}"
          "--revision=${RELEASE_REVISION}"
      - name: Retain dry-run promotion evidence
        if: ${{ inputs.mode == 'dry-run' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: promotion-dry-run-${{ needs.source.outputs.revision }}
          path: release-output
          if-no-files-found: error
          retention-days: 14
      - name: Publish immutable production release
        if: ${{ inputs.mode == 'production' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_REVISION: ${{ needs.source.outputs.revision }}
        run: >-
          gh release create "${RELEASE_TAG}"
          release-input/*/*
          release-output/SHA256SUMS
          release-output/release-manifest.json
          --verify-tag
          --title "WriteLLM ${RELEASE_TAG}"
          --notes "Validated native release matrix for ${RELEASE_REVISION}."
