name: CI

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - '*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PNPM_VERSION: 11.17.0
  NODE_VERSION: 24.15.0

jobs:
  static:
    name: Static and fixture gate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false
      - name: Install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Frozen dependency install
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Verify recovery fixtures
        run: pnpm check:fixtures
      - name: Static gate
        run: pnpm check:fast

  e2e-critical:
    name: Electron critical smoke (Linux x64)
    needs: static
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false
      - name: Install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Frozen dependency install
        run: pnpm install --frozen-lockfile
      - name: Install Linux Electron runtime and Secret Service
        run: |
          sudo apt-get update
          sudo apt-get install --yes dbus-x11 gnome-keyring
      - name: Fresh-build critical Electron E2E
        shell: bash
        run: |
          dbus-run-session -- bash -lc '
            eval "$(printf "%s\n" "writellm-ci-keyring" | gnome-keyring-daemon --unlock --components=secrets)"
            xvfb-run --auto-servernum pnpm check:e2e:critical
          '
      - name: Retain critical E2E failure diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: diagnostics-linux-critical-${{ github.sha }}
          path: test-results
          if-no-files-found: ignore
          retention-days: 14

  electron:
    name: Electron ${{ matrix.target }}
    needs: static
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows-x64
            runner: windows-2022
          - target: macos-arm64
            runner: macos-15
          - target: macos-x64
            runner: macos-15-intel
          - target: linux-x64
            runner: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false
      - name: Install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Frozen dependency install
        run: pnpm install --frozen-lockfile
      - name: Install Linux Secret Service
        if: ${{ matrix.target == 'linux-x64' }}
        run: |
          sudo apt-get update
          sudo apt-get install --yes dbus-x11 gnome-keyring
      - name: Electron tests and production build
        run: pnpm check:electron
      - name: Complete silent Electron E2E
        if: ${{ matrix.target != 'linux-x64' }}
        run: pnpm test:e2e
      - name: Complete silent Electron E2E with Linux Secret Service
        if: ${{ matrix.target == 'linux-x64' }}
        shell: bash
        run: |
          dbus-run-session -- bash -lc '
            eval "$(printf "%s\n" "writellm-ci-keyring" | gnome-keyring-daemon --unlock --components=secrets)"
            xvfb-run --auto-servernum pnpm test:e2e
          '
      - name: Retain synthetic failure diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: diagnostics-${{ matrix.target }}-${{ github.sha }}
          path: test-results
          if-no-files-found: ignore
          retention-days: 14

  package:
    name: Package ${{ matrix.target }}
    needs: electron
    if: ${{ startsWith(github.ref, 'refs/tags/') && success() }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows-x64
            runner: windows-2022
            command: package:windows-x64
          - target: macos-arm64
            runner: macos-15
            command: package:macos-arm64
          - target: macos-x64
            runner: macos-15-intel
            command: package:macos-x64
          - target: linux-x64
            runner: ubuntu-24.04
            command: package:linux-x64
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false
      - name: Install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Frozen dependency install
        run: pnpm install --frozen-lockfile
      - name: Install Linux Secret Service
        if: ${{ matrix.target == 'linux-x64' }}
        run: |
          sudo apt-get update
          sudo apt-get install --yes dbus-x11 gnome-keyring
      - name: Native-host package gate
        if: ${{ matrix.target != 'linux-x64' }}
        run: pnpm run ${{ matrix.command }}
      - name: Native-host package gate with Linux Secret Service
        if: ${{ matrix.target == 'linux-x64' }}
        shell: bash
        run: |
          dbus-run-session -- bash -lc '
            eval "$(printf "%s\n" "writellm-ci-keyring" | gnome-keyring-daemon --unlock --components=secrets)"
            xvfb-run --auto-servernum pnpm run package:linux-x64
          '
      - name: Upload unsigned package evidence
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: writellm-${{ matrix.target }}-${{ github.sha }}
          path: |
            dist/${{ matrix.target }}/*.dmg
            dist/${{ matrix.target }}/*.zip
            dist/${{ matrix.target }}/*.exe
            dist/${{ matrix.target }}/*.AppImage
            dist/${{ matrix.target }}/*.deb
            dist/${{ matrix.target }}/package-evidence.json
          if-no-files-found: error
          retention-days: 30
