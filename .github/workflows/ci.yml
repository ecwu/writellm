name: Cross-platform tag build

on:
  push:
    tags:
      - '*'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  PNPM_VERSION: 12.0.0
  NODE_VERSION: 24.15.0

jobs:
  static:
    name: Static and fixture gate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false
      - name: Install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Verify tag, release version, revision, and clean checkout
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_REVISION: ${{ github.sha }}
        run: >-
          node scripts/verify-release-source.mjs
          "--tag=${RELEASE_TAG}"
          "--revision=${RELEASE_REVISION}"
      - name: Frozen dependency install
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Verify recovery fixtures
        run: pnpm check:fixtures
      - name: Static gate
        run: pnpm check:fast

  platform:
    name: ${{ matrix.label }} build
    needs: static
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows-x64
            label: Windows x64
            runner: windows-2022
            command: package:ci:windows-x64
          - target: macos-arm64
            label: macOS arm64
            runner: macos-15
            command: package:ci:macos-arm64
          - target: macos-x64
            label: macOS x64
            runner: macos-15-intel
            command: package:ci:macos-x64
          - target: linux-x64
            label: Linux x64
            runner: ubuntu-24.04
            command: package:ci:linux-x64
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false
      - name: Install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Frozen dependency install
        run: pnpm install --frozen-lockfile
      - name: Native platform build
        run: pnpm run ${{ matrix.command }}
      - name: Upload unsigned package evidence
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: writellm-${{ matrix.target }}-${{ github.sha }}
          path: |
            dist/${{ matrix.target }}/*.dmg
            dist/${{ matrix.target }}/*.zip
            dist/${{ matrix.target }}/*.exe
            dist/${{ matrix.target }}/*.AppImage
            dist/${{ matrix.target }}/*.deb
            dist/${{ matrix.target }}/package-evidence.json
          if-no-files-found: error
          retention-days: 30
