name: Publish tag release

on:
  workflow_run:
    workflows: [Cross-platform tag build]
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful ci.yml run to publish without rebuilding
        required: true
        type: string
      tag:
        description: Existing immutable release tag (for example v0.2026.9.10)
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: publish-${{ github.event.workflow_run.head_branch || inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') ||
      (github.event_name == 'workflow_dispatch' && github.ref_name == github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout trusted publishing code from default branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.15.0
      - name: Publish four packages from the successful tag build
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id || inputs.run_id }}
          RELEASE_TAG: ${{ github.event.workflow_run.head_branch || inputs.tag }}
        run: node scripts/publish-release.mjs
