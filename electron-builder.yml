appId: com.ecwu.writellm
productName: WriteLLM
directories:
  buildResources: build
files:
  - out/**
  - package.json
asarUnpack:
  - resources/**
  - node_modules/better-sqlite3/**
extraResources:
  - from: resources/native
    to: native
win:
  executableName: writellm
  target:
    - nsis
nsis:
  artifactName: ${productName}-${env.WRITELLM_RELEASE_VERSION}-${arch}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  target:
    - dmg
    - zip
  artifactName: ${productName}-${env.WRITELLM_RELEASE_VERSION}-${arch}.${ext}
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSDocumentsFolderUsageDescription: WriteLLM opens projects selected by the user.
    - NSDownloadsFolderUsageDescription: WriteLLM exports files to locations selected by the user.
  notarize: false
dmg:
  artifactName: ${productName}-${env.WRITELLM_RELEASE_VERSION}-${arch}.${ext}
  window:
    width: 540
    height: 380
  contents:
    - x: 130
      y: 220
      type: file
    - x: 410
      y: 220
      type: link
      path: /Applications
  iconSize: 80
  iconTextSize: 12
linux:
  target:
    - AppImage
    - deb
  maintainer: WriteLLM contributors
  category: Utility
appImage:
  artifactName: ${productName}-${env.WRITELLM_RELEASE_VERSION}-${arch}.${ext}
deb:
  artifactName: ${productName}-${env.WRITELLM_RELEASE_VERSION}-${arch}.${ext}
npmRebuild: false
