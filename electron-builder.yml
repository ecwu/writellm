appId: com.ecwu.writellm
productName: WriteLLM
directories:
  buildResources: build
files:
  - out/**
  - package.json
asarUnpack:
  - resources/**
  - node_modules/better-sqlite3/**
extraResources:
  - from: resources/native
    to: native
win:
  executableName: writellm
  target:
    - nsis
nsis:
  artifactName: ${productName}-${version}-${arch}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  target:
    - dmg
    - zip
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSDocumentsFolderUsageDescription: WriteLLM opens projects selected by the user.
    - NSDownloadsFolderUsageDescription: WriteLLM exports files to locations selected by the user.
  notarize: false
dmg:
  artifactName: ${productName}-${version}-${arch}.${ext}
linux:
  target:
    - AppImage
    - deb
  maintainer: WriteLLM contributors
  category: Utility
appImage:
  artifactName: ${productName}-${version}-${arch}.${ext}
deb:
  artifactName: ${productName}-${version}-${arch}.${ext}
npmRebuild: false
